<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>coco</title>

<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #26241f; --muted: #8a857c;
    --line: #e8e5df; --accent: #1f6f5c; --accent-ink: #ffffff;
    --rec: #c0392b; --soft: #f0eee9; --warn-bg: #fff7e6; --warn: #8a5a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    color: var(--ink); transition: all .15s;
  }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.recording { background: var(--rec); color: #fff; border-color: var(--rec); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  .pulsing { animation: pulse 1.4s ease-in-out infinite; }
  button:disabled { opacity: .4; cursor: default; }

  main { flex: 1; display: flex; min-height: 0; }

  /* sidebar */
  #sidebar {
    width: 270px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 10px;
  }
  #sidebar .section { font-size: 11px; color: var(--muted); letter-spacing: 1px;
    padding: 8px 8px 6px; text-transform: uppercase; }
  .mtg {
    padding: 9px 26px 9px 10px; border-radius: 8px; cursor: pointer;
    margin-bottom: 2px; position: relative;
  }
  .mtg:hover { background: var(--soft); }
  .mtg.active { background: var(--ink); color: #fff; }
  .mtg .t { font-size: 13px; font-weight: 500; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtg .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mtg.active .s { color: #cfcbc4; }
  .mtg .del { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: none; border: none; background: none; color: var(--muted);
    font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .mtg:hover .del { display: block; }
  .mtg .del:hover { color: var(--rec); background: rgba(192,57,43,.08); border: none; }
  .mtg.active .del { color: #cfcbc4; }
  .mtg .hit { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtg .hit i { color: var(--accent); font-style: normal; }
  #search-box { width: 100%; font: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    margin: 4px 0 6px; }
  #search-box:focus { outline: none; border-color: var(--ink); }

  /* content */
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #mtg-head { padding: 16px 24px 0; flex-shrink: 0; }
  #mtg-head h2 { font-size: 19px; font-weight: 600; }
  #mtg-head .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #tabs { display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid var(--line);
    flex-shrink: 0; flex-wrap: wrap; align-items: center; }
  .tab { padding: 7px 14px; font-size: 13px; cursor: pointer; border-radius: 8px 8px 0 0;
    color: var(--muted); border: 1px solid transparent; border-bottom: none; }
  .tab.active { color: var(--ink); background: var(--bg); border-color: var(--line); font-weight: 500; }
  .tab.pending { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  #participants-row { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  #participants-row .plabel { color: var(--muted); }
  #participants-row .muted { color: var(--muted); font-style: italic; }
  #participants-row button.mini { padding: 2px 8px; font-size: 11px; border-radius: 6px; }
  #participants-row input { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 360px; flex: 1; }
  #chat .section button { padding: 2px 8px; font-size: 11px; letter-spacing: 0; text-transform: none; }
  #report-actions { margin-left: auto; display: flex; gap: 8px; padding-bottom: 8px;
    flex-wrap: nowrap; align-items: center; }
  #report-actions button, #report-actions select { white-space: nowrap; flex-shrink: 0; }
  #tpl-select { max-width: 220px; }
  select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink); }
  #doc { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
  #doc .md { max-width: 780px; line-height: 1.75; font-size: 14px; }
  .live-head { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .live-cursor::after { content: "▍"; color: var(--accent); animation: pulse 1s infinite; }

  /* markdown */
  .md h1 { font-size: 20px; margin: 18px 0 10px; }
  .md h2 { font-size: 16px; margin: 18px 0 8px; }
  .md h3 { font-size: 14px; margin: 14px 0 6px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0 8px 22px; }
  .md li { margin: 3px 0; }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: var(--soft); }
  .md code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .md .ts { color: var(--accent); font-size: 12px; font-family: ui-monospace, monospace; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); margin: 8px 0; }

  /* editor */
  #edit-area { width: 100%; height: 72vh; font: 13px/1.8 ui-monospace, "PingFang SC", monospace;
    padding: 14px; border: 1px solid var(--line); border-radius: 10px; resize: vertical;
    background: var(--panel); }
  #edit-area:focus { outline: none; border-color: var(--ink); }

  /* chat */
  #chat {
    width: 360px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
  }
  #chat .section { font-size: 11px; color: var(--muted); letter-spacing: 1px;
    padding: 14px 16px 6px; text-transform: uppercase; flex-shrink: 0; }
  #chat-log { flex: 1; overflow-y: auto; padding: 6px 16px; }
  .bubble { margin: 8px 0; font-size: 13px; line-height: 1.65; }
  .bubble.user { background: var(--ink); color: #fff; border-radius: 12px 12px 2px 12px;
    padding: 8px 12px; margin-left: 40px; }
  .bubble.coco { background: var(--soft); border-radius: 12px 12px 12px 2px;
    padding: 10px 12px; margin-right: 16px; }
  .bubble.coco.thinking { color: var(--muted); font-style: italic; }
  #chat-ref { font-size: 11px; color: var(--muted); padding: 4px 16px; flex-shrink: 0; }
  #chat-input-row { display: flex; gap: 8px; padding: 10px 16px 14px; flex-shrink: 0;
    border-top: 1px solid var(--line); }
  #chat-input { flex: 1; font: inherit; font-size: 13px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 10px; resize: none; height: 40px;
    background: var(--bg); }
  #chat-input:focus { outline: none; border-color: var(--ink); }

  /* memory modal */
  #overlay { position: fixed; inset: 0; background: rgba(38,36,31,.45);
    display: none; align-items: center; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #modal { background: var(--panel); border-radius: 14px; width: 660px; max-width: 92vw;
    max-height: 84vh; display: flex; flex-direction: column; padding: 20px; }
  #modal h3 { font-size: 15px; margin-bottom: 10px; }
  #mem-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  #mem-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #mem-hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #chat-opts { font-size: 12px; color: var(--muted); padding: 2px 16px 4px;
    flex-shrink: 0; user-select: none; }
  #chat-opts label { cursor: pointer; }
  #modal textarea { flex: 1; min-height: 300px; font: 13px/1.6 ui-monospace, monospace;
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; display: none; z-index: 20; max-width: 70vw; }
  #empty { color: var(--muted); padding: 60px; text-align: center; font-size: 14px; line-height: 2; }
  input[type=file] { display: none; }

  /* sidebar: filter + selection */
  #filter-bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 2px 2px 6px; font-size: 12px; color: var(--muted); }
  #filter-bar input[type=date] { font: inherit; font-size: 11px; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
  #filter-bar .sep { color: var(--muted); }
  #filter-bar .lk { cursor: pointer; color: var(--accent); margin-left: auto; padding: 2px 4px; }
  #filter-bar .lk:hover { text-decoration: underline; }
  #sel-bar { display: none; align-items: center; gap: 6px; padding: 6px 6px;
    margin: 2px 0 6px; background: var(--soft); border-radius: 8px; font-size: 12px; }
  #sel-bar.show { display: flex; }
  #sel-bar .cnt { color: var(--muted); flex: 1; }
  #sel-bar button { padding: 5px 10px; font-size: 12px; }
  .mtg { display: flex; align-items: flex-start; gap: 8px; }
  .mtg .sel { margin-top: 3px; flex-shrink: 0; width: 15px; height: 15px;
    accent-color: var(--accent); cursor: pointer; }
  .mtg .body { flex: 1; min-width: 0; }
  .mtg.active .body .date-edit { color: var(--ink); }
  .mtg .s .date { cursor: pointer; border-bottom: 1px dashed transparent; }
  .mtg:hover .s .date { border-bottom-color: var(--muted); }
  .mtg .date-edit { font: inherit; font-size: 11px; padding: 1px 4px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--ink); }

  /* export modal */
  #export-overlay { position: fixed; inset: 0; background: rgba(38,36,31,.45);
    display: none; align-items: center; justify-content: center; z-index: 11; }
  #export-overlay.show { display: flex; }
  #export-modal { background: var(--panel); border-radius: 14px; width: 560px; max-width: 92vw;
    max-height: 84vh; display: flex; flex-direction: column; padding: 20px; }
  #export-modal h3 { font-size: 15px; margin-bottom: 4px; }
  #export-modal .hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #export-list { flex: 1; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px; min-height: 200px; }
  #export-list .grp { margin-bottom: 4px; }
  #export-list .grp > .grp-head { display: flex; align-items: center; gap: 6px; padding: 6px 6px;
    font-size: 12px; color: var(--muted); letter-spacing: .5px; cursor: pointer; }
  #export-list .grp > .grp-head:hover { color: var(--ink); }
  #export-list .item { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 22px;
    font-size: 13px; border-radius: 7px; }
  #export-list .item:hover { background: var(--soft); }
  #export-list .item label { cursor: pointer; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #export-list .item .meta { color: var(--muted); font-size: 11px; }
  #export-list input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
  #export-modal .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }

  /* generic dialogs */
  .ovl { position: fixed; inset: 0; background: rgba(38,36,31,.45);
    display: none; align-items: center; justify-content: center; z-index: 12; }
  .ovl.show { display: flex; }
  .dlg { background: var(--panel); border-radius: 14px; width: 560px; max-width: 92vw;
    max-height: 86vh; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
  .dlg.wide { width: 760px; }
  .dlg h3 { font-size: 15px; margin-bottom: 6px; }
  .dlg h4 { font-size: 13px; margin: 14px 0 6px; color: var(--ink); }
  .dlg .hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
  .dlg label.fld { font-size: 12px; color: var(--muted); margin: 10px 0 4px; display: block; }
  .dlg input[type=text], .dlg input[type=date], .dlg input[type=password], .dlg input[type=number],
  .dlg select.full { width: 100%; font: inherit; font-size: 13px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .dlg textarea { width: 100%; min-height: 150px; font: 13px/1.6 ui-monospace, "PingFang SC", monospace;
    padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }
  .dlg input:focus, .dlg textarea:focus { outline: none; border-color: var(--ink); }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .dlg .radio { display: block; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin: 5px 0; cursor: pointer; }
  .dlg .radio:hover { border-color: var(--ink); }
  .dlg .radio input { accent-color: var(--accent); margin-right: 6px; }
  .dlg .radio .d { color: var(--muted); font-size: 12px; margin-left: 21px; }
  .mini-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .mini-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .prof { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 8px; }
  .prof .test-out { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
  .prof .test-out.ok { color: var(--accent); }
  .prof .test-out.bad { color: var(--rec); }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; line-height: 1.6; margin: 8px 0; }
  .opt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 13px; line-height: 1.6; }
  .opt b { display: block; margin-bottom: 2px; }
  .opt code { background: var(--soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; user-select: all; }
  .tasks { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; align-items: center; }

  /* knowledge base */
  .kchips { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .kstat { background: var(--soft); border-radius: 10px; padding: 8px 16px; font-size: 12px;
    color: var(--muted); text-align: center; }
  .kstat b { display: block; font-size: 18px; color: var(--ink); font-weight: 600; }
  .pchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
  .pchip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
    font-size: 12px; cursor: pointer; background: var(--panel); }
  .pchip:hover { border-color: var(--accent); color: var(--accent); }

  #conn-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: var(--rec); color: #fff; padding: 9px 16px; font-size: 13px; text-align: center; }
  #conn-banner.show { display: block; }
  #ai-banner { display: none; background: #7a5d13; color: #fff; padding: 9px 16px;
    font-size: 13px; text-align: center; flex-shrink: 0; }
  #ai-banner.show { display: block; }
  #ai-banner .lk2 { text-decoration: underline; cursor: pointer; margin-left: 14px; white-space: nowrap; }

  /* header groups, AI chip */
  header .brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
  header .brand img { width: 22px; height: 22px; }
  .hsep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9a227; flex-shrink: 0; }
  .chip.ok .dot { background: #2e9d6f; }
  .icon-btn { padding: 7px 10px; }
  button.recording { box-shadow: 0 0 0 calc(var(--lvl, 0) * 7px) rgba(192,57,43,.28); animation: none; }

  /* empty state: three ways in */
  .starts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 26px auto 18px; max-width: 760px; }
  .start { flex: 1 1 200px; max-width: 240px; text-align: left; padding: 16px 18px; border-radius: 12px; line-height: 1.5; }
  .start b { display: block; font-size: 15px; margin-bottom: 4px; }
  .start small { color: var(--muted); font-size: 12px; }
  .start:hover { border-color: var(--accent); }
  .empty-title { font-size: 18px; color: var(--ink); font-weight: 600; }
  .empty-sub { font-size: 13px; }
  .empty-foot { font-size: 12px; max-width: 620px; margin: 0 auto; line-height: 1.8; }

  /* settings */
  .set-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .set-head h3 { margin: 0; }
  .set-pane { display: none; }
  .set-pane.on { display: block; }
  details.adv { margin-top: 10px; font-size: 13px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0; }
  details.adv[open] summary { color: var(--ink); }
  .combo { display: flex; gap: 6px; }
  .combo input { flex: 1; min-width: 0; }
  .combo button { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  .fld a { color: var(--accent); text-decoration: none; margin-left: 6px; }
  .fld a:hover { text-decoration: underline; }
  .p-status { margin: 8px 0 0; }
  .p-status.ok { background: #eaf6f0; color: #1f6f4a; }
  .p-status button { margin-left: 8px; padding: 3px 10px; font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content 1fr auto; gap: 8px 14px; font-size: 13px; align-items: center; margin-top: 8px; }
  .kv .k { color: var(--muted); }
  .kv code { background: var(--soft); padding: 2px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }

  /* onboarding cards */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
  .choice { text-align: left; padding: 14px 16px; border-radius: 12px; line-height: 1.55; }
  .choice b { display: block; font-size: 14px; margin-bottom: 3px; }
  .choice small { color: var(--muted); font-size: 12px; display: block; }
  .choice .badge { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px; margin-top: 6px;
    background: var(--soft); color: var(--muted); }
  .choice .badge.ok { background: #eaf6f0; color: #1f6f4a; }
  .choice:hover { border-color: var(--accent); }

  .rec-panel { display: flex; align-items: center; gap: 18px; padding: 22px 24px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); max-width: 620px; margin-top: 10px; }
  .rec-panel .rec-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--rec); flex-shrink: 0;
    box-shadow: 0 0 0 calc(var(--lvl, 0) * 12px) rgba(192,57,43,.22); transition: box-shadow .08s; }
  .rec-panel b { font-size: 18px; display: block; font-variant-numeric: tabular-nums; }
  .rec-panel small { color: var(--muted); font-size: 12px; line-height: 1.6; display: block; margin-top: 2px; }
  .rec-panel button { margin-left: auto; white-space: nowrap; }

<script>
const $ = id => document.getElementById(id);
const GUESS_PLATFORM = /win/i.test(navigator.platform) ? 'windows' : /mac/i.test(navigator.platform) ? 'mac' : 'linux';
let state = { caps: { transcribe: 'mlx', record: true, platform: GUESS_PLATFORM, device: '' },
              meetings: [], current: null, tab: 'transcript', recording: false,
  recSeconds: 0, selected: new Set(), filterFrom: '', filterTo: '', cfg: {}, chat: [], pending: null };

/* ---------- i18n ---------- */
let I18N = { lang: 'en', strings: {}, available: [] };
const OUTPUT_LANGS = [['zh-CN','简体中文'],['en','English'],['fr','Français'],['de','Deutsch'],['es','Español'],
  ['it','Italiano'],['pt','Português'],['ja','日本語'],['ko','한국어'],['ru','Русский'],['ar','العربية'],
  ['hi','हिन्दी'],['th','ไทย'],['vi','Tiếng Việt'],['id','Bahasa Indonesia'],['nl','Nederlands'],['tr','Türkçe'],['pl','Polski']];
function t(key, vars) {
  let cur = I18N.strings;
  for (const part of key.split('.')) { cur = cur && typeof cur === 'object' ? cur[part] : undefined; }
  let s = typeof cur === 'string' ? cur : key;
  if (vars) for (const k of Object.keys(vars)) s = s.split(`{${k}}`).join(String(vars[k]));
  return s;
}
function applyI18n() {
  document.documentElement.lang = I18N.lang;
  document.title = 'coco · ' + t('app.subtitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}
function pickLang(cfg) {
  const fromUrl = new URLSearchParams(location.search).get('lang');  // ?lang=fr forces a language (and remembers it)
  if (fromUrl) { localStorage.setItem('coco-lang', fromUrl); return fromUrl; }
  const saved = localStorage.getItem('coco-lang');
  if (saved) return saved;
  if (cfg.ui_language && cfg.ui_language !== 'auto') return cfg.ui_language;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('zh')) return 'zh-CN';
  if (nav.startsWith('fr')) return 'fr';
  return 'en';
}
async function loadI18n(lang) {
  const r = await fetch('/api/i18n?lang=' + encodeURIComponent(lang));
  const d = await r.json();
  I18N = { lang: d.lang, strings: d.strings, available: d.available };
  applyI18n();
}

/* ---------- utils ---------- */
function toast(msg, ms = 3200) {
  $('toast').textContent = msg; $('toast').style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => $('toast').style.display = 'none', ms);
}
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Coco-Lang': I18N.lang }, opts.headers || {});
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function throttle(fn, ms) { let last = 0, tm = null; return (...a) => { const now = Date.now();
  if (now - last >= ms) { last = now; fn(...a); } else { clearTimeout(tm); tm = setTimeout(() => { last = Date.now(); fn(...a); }, ms - (now - last)); } }; }

/* Server-sent events over fetch: onDelta(text) per fragment; resolves with the `done` payload. */
async function streamApi(path, body, onDelta) {
  const res = await fetch(path, { method: 'POST', body: JSON.stringify(body),
    headers: { 'Content-Type': 'application/json', 'X-Coco-Lang': I18N.lang } });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || res.statusText); }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', result = null, error = null;
  const handle = frame => {
    let ev = 'message', data = '';
    frame.split('\n').forEach(l => { if (l.startsWith('event:')) ev = l.slice(6).trim(); else if (l.startsWith('data:')) data += l.slice(5).trim(); });
    if (!data) return;
    let d; try { d = JSON.parse(data); } catch { return; }
    if (ev === 'delta') onDelta(d.text || '');
    else if (ev === 'done') result = d;
    else if (ev === 'error') error = d.detail || 'error';
  };
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) { handle(buf.slice(0, idx)); buf = buf.slice(idx + 2); }
  }
  if (buf.trim()) handle(buf);
  if (error) throw new Error(error);
  if (!result) throw new Error(t('common.stream_interrupted'));
  return result;
}

/* minimal markdown: headings / bold / lists / tables / quotes / code / timestamps */
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', listMode = '', inTable = false;
  const closeList = () => { if (listMode) { html += `</${listMode}>`; listMode = ''; } };
  const closeTable = () => { if (inTable) { html += '</table>'; inTable = false; } };
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(\d+:\d{2}(?::\d{2})?)\]/g, '<span class="ts">[$1]</span>');
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\|.+\|$/.test(line.trim())) {
      closeList();
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!inTable) { html += '<table>'; inTable = true;
        html += '<tr>' + cells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr>'; }
      else html += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      continue;
    }
    closeTable();
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.+)/))) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = line.match(/^[-*]\s+(.+)/))) { if (listMode !== 'ul') { closeList(); html += '<ul>'; listMode = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\d+[.、]\s+(.+)/))) { if (listMode !== 'ol') { closeList(); html += '<ol>'; listMode = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^(?:>|&gt;)\s?(.*)/))) { closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (line === '') { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeList(); closeTable();
  return html;
}

/* A live view: header + growing markdown while the model streams. Returns updater(text). */
function showLiveView(title, headline) {
  $('empty').style.display = 'none';
  $('mtg-head').style.display = ''; $('tabs').style.display = 'none'; $('doc').style.display = '';
  $('mtg-title').textContent = title;
  $('mtg-meta').innerHTML = ''; $('mtg-meta').style.cssText = '';
  $('mtg-meta').textContent = headline;
  $('doc-md').innerHTML = `<div class="live-head pulsing">${esc(headline)}</div><div id="live-md" class="md live-cursor"></div>`;
  state.current = null; updateChatRef();
  return throttle(text => { const el = $('live-md'); if (el) { el.innerHTML = md(text); $('doc').scrollTop = $('doc').scrollHeight; } }, 160);
}

/* ---------- library ---------- */
async function loadMeetings(keepCurrent = true) {
  state.meetings = await api('/api/meetings');
  if (!state.searchQuery) renderMeetingList();
  if (keepCurrent && state.current) renderDocIfStale();
}

function effectiveMeetings() {
  let ms = state.meetings;
  if (state.filterFrom) ms = ms.filter(m => (m.date || '') >= state.filterFrom);
  if (state.filterTo) ms = ms.filter(m => (m.date || '') <= state.filterTo);
  return ms;
}

function renderMeetingList() {
  if (state.searchQuery) return;
  if (state.editingDate) return;
  const ms = effectiveMeetings();
  const sig = JSON.stringify([ms, state.current, state.filterFrom, state.filterTo, I18N.lang]);
  if (sig === renderMeetingList._sig) { updateSelBar(); return; }
  renderMeetingList._sig = sig;
  const list = $('mtg-list');
  list.innerHTML = '';
  if (!state.meetings.length) {
    list.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--muted)">${esc(t('sidebar.empty'))}</div>`;
    updateSelBar(); return;
  }
  if (!ms.length) {
    list.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--muted)">${esc(t('sidebar.no_match_date'))}</div>`;
    updateSelBar(); return;
  }
  for (const m of ms) {
    const div = document.createElement('div');
    div.className = 'mtg' + (state.current === m.id ? ' active' : '');
    const mark = { done: '', transcribing: '⏳ ', error: '⚠️ ', new: '· ', recording: '⏺ ' }[m.status] || '';
    const time = m.created && m.created.includes('T') ? m.created.slice(11, 16) : '';
    div.innerHTML =
      `<input type="checkbox" class="sel"${state.selected.has(m.id) ? ' checked' : ''} title="${esc(t('sidebar.sel_title'))}">
       <div class="body">
         <div class="t">${mark}${esc(m.title)}</div>
         <div class="s"><span class="date" title="${esc(t('sidebar.date_title'))}">${esc(m.date || '—')}</span> ${time} ${esc(m.duration || '')}</div>
       </div>
       <button class="del" title="${esc(t('sidebar.del_title'))}">✕</button>`;
    div.onclick = () => openMeeting(m.id);
    const cb = div.querySelector('.sel');
    cb.onclick = e => { e.stopPropagation(); toggleSelect(m.id, cb.checked); };
    div.querySelector('.del').onclick = e => { e.stopPropagation(); delMeeting(m); };
    div.querySelector('.date').onclick = e => { e.stopPropagation(); editMeetingDate(m, e.target); };
    list.appendChild(div);
  }
  updateSelBar();
}

/* ---------- sidebar: selection, date filter, date edit ---------- */
function toggleSelect(id, on) {
  if (on) state.selected.add(id); else state.selected.delete(id);
  updateSelBar();
}

function updateSelBar() {
  const ids = new Set(state.meetings.map(m => m.id));
  for (const id of [...state.selected]) if (!ids.has(id)) state.selected.delete(id);
  const n = state.selected.size;
  const visible = new Set(effectiveMeetings().map(m => m.id));
  const hidden = [...state.selected].filter(id => !visible.has(id)).length;
  $('sel-bar').classList.toggle('show', n > 0 && !state.searchQuery);
  if (n) $('sel-count').textContent = hidden
    ? t('sidebar.selected_hidden', { n, hidden })
    : t('sidebar.selected', { n });
}

function selectedMeetingItems() {
  const items = [];
  for (const id of state.selected) {
    const m = state.meetings.find(x => x.id === id);
    if (!m) continue;
    if (m.has_transcript) items.push({ type: 'transcript', id });
    (m.reports || []).forEach(name => items.push({ type: 'report', id, name }));
  }
  return items;
}

async function postDownload(items) {
  if (!items.length) { toast(t('export.nothing')); return; }
  toast(t('export.packing'));
  try {
    const res = await fetch('/api/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Coco-Lang': I18N.lang },
      body: JSON.stringify({ items }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || res.statusText);
    }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const mm = cd.match(/filename\*=UTF-8''([^;]+)/);
    const fname = mm ? decodeURIComponent(mm[1]) : 'coco-export.zip';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(t('export.done'));
  } catch (e) { toast(t('export.failed', { msg: e.message }), 6000); }
}

$('sel-download').onclick = () => postDownload(selectedMeetingItems());
$('sel-insight').onclick = async () => {
  await $('btn-track').onclick();
  const sel = document.querySelector('input[name="ins-scope"][value="sel"]');
  if (sel && !sel.disabled) sel.checked = true;
};
$('sel-clear').onclick = () => {
  state.selected.clear();
  document.querySelectorAll('#mtg-list .sel').forEach(c => c.checked = false);
  updateSelBar();
};
$('filter-from').onchange = e => { state.filterFrom = e.target.value; renderMeetingList(); };
$('filter-to').onchange = e => { state.filterTo = e.target.value; renderMeetingList(); };
$('filter-clear').onclick = () => {
  state.filterFrom = state.filterTo = '';
  $('filter-from').value = ''; $('filter-to').value = '';
  renderMeetingList();
};

function editMeetingDate(m, span) {
  state.editingDate = true;
  const input = document.createElement('input');
  input.type = 'date'; input.className = 'date-edit'; input.value = m.date || '';
  span.replaceWith(input);
  input.focus();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    state.editingDate = false;
    const v = input.value;
    renderMeetingList._sig = null;
    if (save && v && v !== m.date) {
      try {
        await api(`/api/meetings/${encodeURIComponent(m.id)}/meta`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: v }),
        });
        toast(t('meeting.date_updated'));
        await loadMeetings();
      } catch (e) { toast(t('meeting.update_failed', { msg: e.message }), 6000); renderMeetingList(); }
    } else {
      renderMeetingList();
    }
  };
  input.onclick = e => e.stopPropagation();
  input.onchange = () => finish(true);
  input.onblur = () => finish(true);
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
}

async function delMeeting(m) {
  if (!confirm(t('meeting.delete_confirm', { title: m.title }))) return;
  try {
    await api('/api/meetings/' + encodeURIComponent(m.id), { method: 'DELETE' });
    toast(t('meeting.deleted'));
    if (state.current === m.id) { state.current = null; showEmpty(); }
    state.searchQuery ? doSearch() : loadMeetings();
  } catch (e) { toast(t('meeting.delete_failed', { msg: e.message }), 6000); }
}

function showEmpty() {
  $('empty').style.display = '';
  $('mtg-head').style.display = 'none';
  $('tabs').style.display = 'none';
  $('doc').style.display = 'none';
  updateChatRef();
}

/* ---------- search ---------- */
let searchTimer;
$('search-box').addEventListener('input', e => {
  state.searchQuery = e.target.value.trim();
  clearTimeout(searchTimer);
  if (!state.searchQuery) { renderMeetingList(); return; }
  searchTimer = setTimeout(doSearch, 350);
});

async function doSearch() {
  const q = state.searchQuery;
  if (!q) return;
  const results = await api('/api/search?q=' + encodeURIComponent(q));
  if (q !== state.searchQuery) return;
  renderMeetingList._sig = null;
  const list = $('mtg-list');
  list.innerHTML = '';
  if (!results.length) {
    list.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--muted)">${esc(t('sidebar.no_results'))}</div>`;
    return;
  }
  for (const r of results) {
    const div = document.createElement('div');
    div.className = 'mtg' + (state.current === r.id ? ' active' : '');
    const hits = r.matches.map(h => `<div class="hit">[${esc(h.where)}] ${esc(h.line)}</div>`).join('');
    div.innerHTML = `<div class="body"><div class="t">${esc(r.title)}</div>${hits}</div>`;
    div.onclick = () => {
      list.querySelectorAll('.mtg.active').forEach(x => x.classList.remove('active'));
      div.classList.add('active');
      openMeeting(r.id);
    };
    list.appendChild(div);
  }
}

async function openMeeting(id) {
  state.current = id; state.tab = 'transcript'; state.editing = false;
  await renderMeeting();
  loadMeetings();
}

async function renderMeeting() {
  if (!state.current) return;
  const m = await api('/api/meetings/' + encodeURIComponent(state.current));
  state.currentData = m;
  $('empty').style.display = 'none';
  $('mtg-head').style.display = ''; $('tabs').style.display = 'flex'; $('doc').style.display = '';
  $('mtg-title').textContent = m.title;
  $('mtg-meta').style.cssText = '';
  let metaLine = `${m.created.slice(0, 16).replace('T', ' ')} · `
    + `${m.duration || (m.language === 'imported' ? t('doc.meta_text') : t('doc.meta_untranscribed'))} · ${m.source_label || m.source}`;
  if (m.language && !['auto', 'imported', ''].includes(m.language)) metaLine += ' · ' + t('doc.meta_lang', { lang: m.language });
  $('mtg-meta').textContent = metaLine;
  renderParticipants(m);
  const tabs = $('tabs'); tabs.innerHTML = '';
  const addTab = (key, label) => {
    const el = document.createElement('div');
    el.className = 'tab' + (state.tab === key ? ' active' : '');
    el.textContent = label;
    el.onclick = () => { state.tab = key; state.editing = false; renderMeeting(); };
    tabs.appendChild(el);
  };
  addTab('transcript', t('doc.tab_transcript'));
  m.report_list.forEach(r => addTab('r:' + r.name, r.label || r.name));
  const pendingHere = state.pending && state.pending.mid === m.id;
  if (pendingHere) {  // the report being generated gets its own tab right away; other tabs stay readable
    const el = document.createElement('div');
    el.className = 'tab pending' + (state.tab === 'gen' ? ' active' : '');
    el.textContent = '⏳ ' + state.pending.tplName;
    el.onclick = () => { state.tab = 'gen'; state.editing = false; renderMeeting(); };
    tabs.appendChild(el);
  } else if (state.tab === 'gen') state.tab = 'transcript';
  const actions = document.createElement('div');
  actions.id = 'report-actions';
  tabs.appendChild(actions);

  if (m.status === 'recording') {  // nothing to edit, download or analyse yet: just the live recording
    const mine = rec.active && rec.id === m.id;
    $('doc-md').innerHTML = mine
      ? `<div class="rec-panel" id="rec-panel"><div class="rec-dot"></div><div><b id="rec-panel-time">${esc(t('record.panel_time', { time: fmtRec(state.recSeconds) }))}</b>
           <small>${esc(t('record.panel_hint'))}</small></div><button class="primary" id="btn-rec-stop">${esc(t('record.panel_stop'))}</button></div>`
      : `<div class="rec-panel"><div class="rec-dot"></div><div><b>${esc(t('record.elsewhere'))}</b><small>${esc(t('record.panel_elsewhere'))}</small></div></div>`;
    const sb = $('btn-rec-stop'); if (sb) sb.onclick = () => stopRecording();
    updateChatRef();
    return;
  }

  if (state.editing) {
    const isT = state.tab === 'transcript';
    actions.innerHTML = `<button id="btn-cancel">${esc(t('common.cancel'))}</button>
      <button id="btn-save" class="primary">${esc(isT ? t('doc.save_transcript') : t('doc.save_report'))}</button>`;
    actions.querySelector('#btn-cancel').onclick = () => { state.editing = false; renderMeeting(); };
    actions.querySelector('#btn-save').onclick = isT ? saveTranscript : saveReport;
    $('doc-md').innerHTML = '';
    const ta = document.createElement('textarea');
    ta.id = 'edit-area';
    if (isT) ta.value = m.transcript || '';
    else { const r = m.report_list.find(r => 'r:' + r.name === state.tab); ta.value = r ? r.content : ''; }
    $('doc-md').appendChild(ta);
    updateChatRef();
    return;
  }

  const isT = state.tab === 'transcript';
  const extra = `<button id="btn-edit">${esc(t('doc.edit'))}</button>`
    + (isT ? `<button id="btn-clean" title="${esc(t('doc.clean_title'))}">${esc(t('doc.clean'))}</button>` : '')
    + (isT && m.has_raw ? `<button id="btn-restore" title="${esc(t('doc.restore_title'))}">${esc(t('doc.restore'))}</button>` : '');
  const delBtn = isT ? '' : `<button id="btn-del-report">${esc(t('common.delete'))}</button>`;
  const fmtSel = isT ? `<select id="dl-fmt" title="${esc(t('doc.download_format_title'))}">
      <option value="md">.md</option><option value="txt">.txt</option>
      ${m.has_segments ? '<option value="srt">.srt</option><option value="vtt">.vtt</option><option value="json">.json</option>' : ''}
    </select>` : '';
  const isGen = state.tab === 'gen';
  actions.innerHTML = `${isGen ? '' : extra + fmtSel + `<button id="btn-dl">${esc(isT ? t('doc.download') : t('common.download_md'))}</button>` + delBtn}
    <select id="tpl-select"></select>
    <button id="btn-gen" class="primary"${pendingHere ? ' disabled' : ''}>${esc(pendingHere ? t('doc.generating') : t('doc.generate'))}</button>`;
  const sel = actions.querySelector('#tpl-select');
  (state.templates || []).forEach(tp => {
    const o = document.createElement('option');
    o.value = tp.id; o.textContent = tp.name; o.title = tp.desc;
    sel.appendChild(o);
  });
  if (state.lastTemplate) sel.value = state.lastTemplate;
  actions.querySelector('#btn-gen').onclick = genReport;
  if (isGen) { renderLive(); updateChatRef(); return; }
  actions.querySelector('#btn-dl').onclick = () => {
    const mid = encodeURIComponent(state.current);
    const url = isT
      ? `/api/download/meeting/${mid}/transcript?fmt=${encodeURIComponent($('dl-fmt').value)}&lang=${I18N.lang}`
      : `/api/download/meeting/${mid}/report/${encodeURIComponent(state.tab.slice(2))}?lang=${I18N.lang}`;
    window.location.href = url;
  };
  actions.querySelector('#btn-edit').onclick = () => { state.editing = true; renderMeeting(); };
  if (isT) {
    const rb = actions.querySelector('#btn-restore');
    if (rb) rb.onclick = restoreRaw;
    actions.querySelector('#btn-clean').onclick = cleanTranscript;
  } else {
    actions.querySelector('#btn-del-report').onclick = async () => {
      const name = state.tab.slice(2);
      const r = m.report_list.find(r => r.name === name);
      if (!confirm(t('report.delete_confirm', { name: r ? r.label : name }))) return;
      try {
        await api(`/api/meetings/${encodeURIComponent(state.current)}/reports/${encodeURIComponent(name)}`, { method: 'DELETE' });
        state.tab = 'transcript'; toast(t('report.deleted'));
        await renderMeeting();
      } catch (e) { toast(t('report.delete_failed', { msg: e.message }), 6000); }
    };
  }

  if (isT && !m.transcript && m.status === 'transcribing') {
    const d = m.job_detail || t('doc.transcribing');
    $('doc-md').innerHTML = `<div id="job-status" class="pulsing" style="color:var(--muted)">⏳ ${esc(d)}</div>`;
  } else if (isT && !m.transcript && m.status === 'error') {
    $('doc-md').innerHTML = `<div style="color:var(--rec)">⚠️ ${esc(t('doc.transcribe_error'))}</div>`;
  } else {
    let content;
    if (isT) content = m.transcript || t('doc.no_transcript');
    else { const r = m.report_list.find(r => 'r:' + r.name === state.tab); content = r ? r.content : ''; }
    $('doc-md').innerHTML = md(content);
  }
  updateChatRef();
}

async function saveTranscript() {
  const content = $('edit-area').value;
  try {
    await api(`/api/meetings/${encodeURIComponent(state.current)}/transcript`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }),
    });
    state.editing = false; toast(t('transcript.saved'));
    await renderMeeting();
  } catch (e) { toast(t('common.save_failed', { msg: e.message }), 6000); }
}

async function saveReport() {
  const name = state.tab.slice(2);
  const content = $('edit-area').value;
  try {
    await api(`/api/meetings/${encodeURIComponent(state.current)}/reports/${encodeURIComponent(name)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }),
    });
    state.editing = false; toast(t('report.saved'));
    await renderMeeting();
  } catch (e) { toast(t('common.save_failed', { msg: e.message }), 6000); }
}

async function cleanTranscript() {
  const mid = state.current;
  try {
    const pre = await api(`/api/meetings/${encodeURIComponent(mid)}/clean`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apply: false }) });
    if (!pre.count) { toast(t('doc.clean_none')); return; }
    const sample = pre.removed.slice(0, 8).map(l => '  ' + l.slice(0, 80)).join('\n') + (pre.count > 8 ? `\n  … +${pre.count - 8}` : '');
    if (!confirm(t('doc.clean_confirm', { n: pre.count, sample }))) return;
    const r = await api(`/api/meetings/${encodeURIComponent(mid)}/clean`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apply: true }) });
    toast(t('doc.clean_done', { n: r.count }), 6000);
    if (state.current === mid) renderMeeting();
  } catch (e) { toast(t('common.failed', { msg: e.message }), 8000); }
}

async function restoreRaw() {
  if (!confirm(t('transcript.restore_confirm'))) return;
  try {
    await api('/api/meetings/' + encodeURIComponent(state.current) + '/restore-raw', { method: 'POST' });
    toast(t('transcript.restored'));
    await renderMeeting();
  } catch (e) { toast(t('transcript.restore_failed', { msg: e.message }), 8000); }
}

function renderDocIfStale() {
  if (state.editing || state.tab === 'gen') return;
  const cur = state.meetings.find(m => m.id === state.current);
  if (!cur) return;
  if (state.currentData && cur.status !== state.currentData.status) { renderMeeting(); return; }
  if (cur.status === 'transcribing' && cur.job_detail) {
    const el = $('job-status');
    if (el) el.textContent = '⏳ ' + cur.job_detail;
  }
}

/* ---------- reports (streamed into their own pending tab) ---------- */
function renderLive() {
  const p = state.pending; if (!p) return;
  $('doc-md').innerHTML = `<div class="live-head pulsing"><span id="live-status"></span></div><div id="live-md" class="md live-cursor"></div>`;
  updateLiveStatus();
  $('live-md').innerHTML = md(p.acc);
}
function updateLiveStatus() {
  const p = state.pending, el = $('live-status'); if (!p || !el) return;
  const s = Math.round((Date.now() - p.startedAt) / 1000);
  el.textContent = p.acc ? t('report.generating_elapsed', { tpl: p.tplName, s }) : t('report.thinking', { tpl: p.tplName, s });
}
async function genReport() {
  if (state.pending) { toast(t('report.busy')); return; }
  const sel = $('tpl-select'); const tpl = sel.value; state.lastTemplate = tpl;
  const tplName = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : tpl;
  const mid = state.current;
  const p = state.pending = { mid, tpl, tplName, acc: '', startedAt: Date.now(), timer: null };
  p.timer = setInterval(updateLiveStatus, 1000);
  state.tab = 'gen'; state.editing = false;
  await renderMeeting();
  const paint = throttle(() => {
    const el = $('live-md');
    if (el && state.current === mid && state.tab === 'gen') { el.innerHTML = md(p.acc); $('doc').scrollTop = $('doc').scrollHeight; }
  }, 160);
  try {
    const r = await streamApi('/api/stream/report', { id: mid, template: tpl }, txt => { p.acc += txt; paint(); updateLiveStatus(); });
    clearInterval(p.timer); state.pending = null;
    toast(t('report.done'));
    if (state.current === mid) { if (state.tab === 'gen') state.tab = 'r:' + r.name; await renderMeeting(); }
    else loadMeetings();
  } catch (e) {
    clearInterval(p.timer); state.pending = null;
    toast(t('report.failed', { msg: e.message }), 8000);
    if (state.current === mid) { if (state.tab === 'gen') state.tab = 'transcript'; renderMeeting(); }
  }
}

/* ---------- participants (names + roles, written into the transcript header) ---------- */
function renderParticipants(m) {
  const row = document.createElement('div');
  row.id = 'participants-row';
  row.innerHTML = `<span class="plabel">${esc(t('doc.participants'))}:</span>
    <span id="participants-text" class="${m.participants ? '' : 'muted'}">${esc(m.participants || t('doc.participants_empty'))}</span>
    <button class="mini" id="btn-participants-edit" title="${esc(t('doc.participants_edit_title'))}">${esc(t('doc.participants_edit'))}</button>
    <button class="mini" id="btn-participants-detect" title="${esc(t('doc.participants_detect_title'))}">${esc(t('doc.participants_detect'))}</button>`;
  $('mtg-meta').appendChild(row);
  row.querySelector('#btn-participants-edit').onclick = () => editParticipants(m, m.participants || '');
  row.querySelector('#btn-participants-detect').onclick = async () => {
    const b = row.querySelector('#btn-participants-detect'); const label = b.textContent;

/* ---------- recording ---------- */
/* Default: the browser records (MediaRecorder) and sends 4-second chunks that the server appends
   to the meeting's audio file, so a closed tab or a crash keeps everything recorded so far.
   record_mode "ffmpeg" keeps the older server-side recorder (macOS, e.g. BlackHole inputs). */
let recTimer = null;
const rec = { active: false, id: '', mr: null, stream: null, queue: [], seq: 0, pumping: false, failed: false,
              startedAt: 0, ctx: null, raf: 0, quietSince: 0, warnedQuiet: false, elsewhere: false };
function fmtRec(s) { const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
function setRecUI() {
  const b = $('btn-record'); if (!b) return;
  b.disabled = rec.elsewhere && !state.recording;
  const pt = $('rec-panel-time');
  if (pt) pt.textContent = t('record.panel_time', { time: fmtRec(state.recSeconds) });
  if (state.recording) { b.classList.add('recording'); b.textContent = t('record.stop', { time: fmtRec(state.recSeconds) }); }
  else if (rec.elsewhere) { b.classList.remove('recording'); b.textContent = t('record.elsewhere'); }
  else { b.classList.remove('recording'); b.textContent = t('header.record'); b.style.removeProperty('--lvl'); }
}
function startRecTimer() {
  clearInterval(recTimer);
  recTimer = setInterval(async () => {
    if (rec.active) { state.recSeconds = Math.floor((Date.now() - rec.startedAt) / 1000); setRecUI(); return; }
    try {
      const s = await api('/api/record/status');
      state.recSeconds = Math.floor(s.elapsed || 0);
      state.recording = !!s.active && s.mode === 'ffmpeg';
      setRecUI();
      if (!state.recording) clearInterval(recTimer);
    } catch {}
  }, 1000);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function onBeforeUnload(e) { if (rec.active) { e.preventDefault(); e.returnValue = ''; } }

async function startRecording() {
  if (state.caps.recordMode === 'ffmpeg') return startServerRecording();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    toast(t('record.no_browser_support'), 9000); return;
  }
  let stream;
  const btn = $('btn-record');
  btn.disabled = true; btn.textContent = t('record.opening_mic');  // the browser may be showing its permission prompt
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true,
      noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    btn.disabled = false; setRecUI();
    toast(t(e && e.name === 'NotAllowedError' ? 'record.mic_denied' : 'record.mic_failed', { msg: e.message || e.name }), 12000);
    return;
  }
  btn.disabled = false;
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  let r;
  try {
    r = await api('/api/record/browser/start', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: '', mime: mime || 'audio/webm' }) });
  } catch (e) { stream.getTracks().forEach(tr => tr.stop()); setRecUI(); toast(t('record.start_failed', { msg: e.message }), 9000); return; }
  Object.assign(rec, { active: true, id: r.meeting_id, stream, queue: [], seq: 0, failed: false, startedAt: Date.now(),
    quietSince: Date.now(), warnedQuiet: false });
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined);
  rec.mr = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) { rec.queue.push(e.data); pumpChunks(); } };
  mr.start(4000);
  startLevelMeter(stream);
  window.addEventListener('beforeunload', onBeforeUnload);
  state.recording = true; state.recSeconds = 0; setRecUI(); startRecTimer();
  toast(t('record.started_browser'));
  await loadMeetings();
  if (!state.editing && !state.pending) openMeeting(rec.id);  // the main area shows the live recording
}

async function pumpChunks() {
  if (rec.pumping) return;
  rec.pumping = true;
  while (rec.queue.length && !rec.failed) {
    const blob = rec.queue[0];
    let ok = false;
    for (let attempt = 0; attempt < 6 && !ok; attempt++) {
      try {
        const res = await fetch(`/api/record/browser/chunk?id=${encodeURIComponent(rec.id)}&seq=${rec.seq}`, {
          method: 'POST', body: blob, headers: { 'Content-Type': 'application/octet-stream', 'X-Coco-Lang': I18N.lang } });
        if (res.ok) ok = true;
        else if (res.status === 409) break;  // the server no longer knows this recording
        else await sleep(1000 * (attempt + 1));
      } catch { await sleep(1000 * (attempt + 1)); }  // server restarting / network blip: retry
    }
    if (!ok) { rec.failed = true; toast(t('record.upload_failed'), 12000); break; }
    rec.queue.shift(); rec.seq++;
  }
  rec.pumping = false;
}

function startLevelMeter(stream) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    rec.ctx = new Ctx();
    const an = rec.ctx.createAnalyser(); an.fftSize = 512;
    rec.ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const tick = () => {
      if (!rec.active) return;
      an.getByteTimeDomainData(buf);
      let sum = 0; for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
      const lvl = Math.min(1, Math.sqrt(sum / buf.length) * 6);
      $('btn-record').style.setProperty('--lvl', lvl.toFixed(2));
      const panel = $('rec-panel'); if (panel) panel.style.setProperty('--lvl', lvl.toFixed(2));
      if (lvl > 0.04) rec.quietSince = Date.now();
      else if (!rec.warnedQuiet && Date.now() - rec.quietSince > 20000) { rec.warnedQuiet = true; toast(t('record.quiet'), 10000); }
      rec.raf = requestAnimationFrame(tick);
    };
    tick();
  } catch {}
}

async function stopBrowserRecording(quiet) {
  if (!rec.active) return;
  const mr = rec.mr;
  await new Promise(res => { mr.onstop = res; try { mr.stop(); } catch { res(); } });
  rec.stream.getTracks().forEach(tr => tr.stop());
  cancelAnimationFrame(rec.raf);
  try { rec.ctx && rec.ctx.close(); } catch {}
  for (let i = 0; i < 120 && (rec.queue.length || rec.pumping) && !rec.failed; i++) await sleep(250);  // last chunks
  rec.active = false;
  window.removeEventListener('beforeunload', onBeforeUnload);
  clearInterval(recTimer); state.recording = false; setRecUI();
  try {
    const r = await api('/api/record/browser/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: rec.id }) });
    if (!quiet) { toast(t('record.stopped')); watchJob(r.job, r.meeting_id); }
  } catch (e) { if (!quiet) toast(t('record.stop_failed', { msg: e.message }), 8000); }
}

/* a page load while the server still holds a browser recording: another tab is recording, or the
   tab that recorded was closed / crashed → offer to keep what arrived */
async function checkRecordingOnLoad() {
  let s;
  try { s = await api('/api/record/status'); } catch { return; }
  if (!s.active) return;
  if (s.mode === 'ffmpeg') { state.recording = true; state.recSeconds = Math.floor(s.elapsed || 0); startRecTimer(); return; }
  if (s.idle < 15) { rec.elsewhere = true; setRecUI(); watchElsewhere(); return; }
  const mins = Math.max(1, Math.round((s.elapsed - s.idle) / 60));
  const ans = await choose(t('record.recover_title'), t('record.recover_body', { min: mins, mb: (s.bytes / 1048576).toFixed(1) }),
    [['later', t('record.recover_later')], ['discard', t('record.recover_discard')], ['keep', t('record.recover_keep'), true]]);
  if (ans !== 'keep' && ans !== 'discard') return;
  try {
    const r = await api('/api/record/browser/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: s.meeting_id, discard: ans === 'discard' }) });
    if (ans === 'keep') { toast(t('record.stopped')); watchJob(r.job, r.meeting_id); } else loadMeetings();
  } catch (e) { toast(t('common.failed', { msg: e.message }), 8000); }
}
function watchElsewhere() {
  const timer = setInterval(async () => {
    try { const s = await api('/api/record/status'); if (!s.active || s.mode !== 'browser') { clearInterval(timer); rec.elsewhere = false; setRecUI(); loadMeetings(); } } catch {}
  }, 4000);
}

async function startServerRecording() {
  try {
    await api('/api/record/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: '' }) });
    state.recording = true; state.recSeconds = 0; setRecUI(); startRecTimer();
    toast(t('record.started'));
  } catch (e) { toast(t('record.start_failed', { msg: e.message }), 9000); }
}
async function stopRecording() {
  if (rec.active) return stopBrowserRecording(false);
  try {
    const r = await api('/api/record/stop', { method: 'POST' });
    clearInterval(recTimer); state.recording = false; setRecUI();
    toast(t('record.stopped'));
    watchJob(r.job, r.meeting_id);
  } catch (e) { toast(t('record.stop_failed', { msg: e.message }), 8000); }
}
$('btn-record').onclick = () => state.recording ? stopRecording() : startRecording();

/* ---------- job polling ---------- */
function watchJob(jid, meetingId) {
  loadMeetings();
  const timer = setInterval(async () => {
    try {
      const j = await api('/api/jobs/' + jid);

        clearInterval(timer); toast(t('job.done'));
        await loadMeetings();
        if (state.editing && state.current === meetingId) toast(t('job.done_editing'), 6000);

function briefModeSwitch(meta, mode) {
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:flex;gap:4px;margin-right:6px';
  [['day', t('brief.day')], ['week', t('brief.week')]].forEach(([m, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (m === mode) { b.style.background = 'var(--ink)'; b.style.color = '#fff'; }
    b.onclick = () => { if (m !== mode) (m === 'day' ? showBriefView() : showWeeklyView()); };
    wrap.appendChild(b);
  });
  meta.appendChild(wrap);
}

async function showBriefView(selDate) {
  const briefs = await api('/api/briefs');
  const dates = new Map();
  briefs.forEach(b => dates.set(b.date, b.content));
  state.meetings.filter(m => m.has_transcript)
    .forEach(m => { const d = m.date || m.created.slice(0, 10); if (!dates.has(d)) dates.set(d, null); });
  const sorted = [...dates.keys()].sort().reverse();
  if (!sorted.length) { toast(t('brief.none')); return; }
  const date = dates.has(selDate) ? selDate : sorted[0];

  $('empty').style.display = 'none';
  $('mtg-head').style.display = ''; $('tabs').style.display = 'none'; $('doc').style.display = '';
  $('mtg-title').textContent = t('brief.title');
  const meta = $('mtg-meta');
  meta.innerHTML = '';
  meta.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap';
  briefModeSwitch(meta, 'day');
  const sel = document.createElement('select');
  sorted.forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    o.textContent = d + (dates.get(d) === null ? t('brief.not_generated') : '');
    if (d === date) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => showBriefView(sel.value);
  meta.appendChild(sel);
  const gen = document.createElement('button');
  gen.textContent = dates.get(date) === null ? t('brief.generate') : t('brief.regenerate');
  gen.onclick = async () => {
    const paint = showLiveView(t('brief.title'), t('brief.generating_toast', { date }));
    let acc = '';
    try {
      await streamApi('/api/stream/brief', { date }, txt => { acc += txt; paint(acc); });
      toast(t('brief.done'));
      showBriefView(date);
    } catch (e) { toast(e.message, 8000); showBriefView(date); }
  };
  meta.appendChild(gen);
  if (dates.get(date) !== null) {
    const dl = document.createElement('button');
    dl.textContent = t('common.download_md');
    dl.onclick = () => { window.location.href = '/api/download/brief/' + date + '?lang=' + I18N.lang; };
    meta.appendChild(dl);
    const del = document.createElement('button');
    del.textContent = t('common.delete');
    del.onclick = async () => {

function pollJob(job, btn, label, onDone) {
  const timer = setInterval(async () => {
    try {
      const j = await api('/api/jobs/' + job);
      if (j.detail && btn) btn.textContent = j.detail.length > 26 ? j.detail.slice(0, 26) + '…' : j.detail;
      if (j.status === 'done') { clearInterval(timer); if (btn) { btn.disabled = false; btn.textContent = label; } onDone(j); }
      else if (j.status === 'error') { clearInterval(timer); if (btn) { btn.disabled = false; btn.textContent = label; } toast(t('common.failed', { msg: j.detail }), 9000); }
    } catch { clearInterval(timer); if (btn) { btn.disabled = false; btn.textContent = label; } }
  }, 2000);
}

async function openExport() {
  $('export-list').innerHTML = `<div style="padding:20px;color:var(--muted);font-size:13px">${esc(t('common.loading'))}</div>`;
  $('export-overlay').className = 'show';
  let mm;
  try { mm = await api('/api/export/manifest'); }
  catch (e) { $('export-list').innerHTML = `<div style="padding:20px;color:var(--rec)">${esc(t('common.load_failed', { msg: e.message }))}</div>`; return; }
  const groups = [];
  if (mm.meetings.length) {
    const items = [];
    mm.meetings.forEach(m => m.files.forEach(f => items.push({
      spec: { type: f.type, id: m.id, name: f.name }, label: `${m.title} · ${f.label}`, meta: m.date,
    })));
    groups.push({ title: t('export.group_meetings'), items });
  }
  const grp = (arr, type, title) => { if ((arr || []).length) groups.push({ title, items: arr.map(b => ({ spec: { type, name: b.name }, label: b.label, meta: '' })) }); };
  grp(mm.briefs, 'brief', t('export.group_briefs'));
  grp(mm.weeklies, 'weekly', t('export.group_weeklies'));
  grp(mm.tracking, 'tracking', t('export.group_tracking'));
  grp(mm.preps, 'prep', t('export.group_preps'));

  const wrap = $('export-list');
  wrap.innerHTML = '';
  exportItems = [];
  if (!groups.length) wrap.innerHTML = `<div style="padding:20px;color:var(--muted)">${esc(t('export.none'))}</div>`;
  let idx = 0;
  groups.forEach(g => {
    const gd = document.createElement('div'); gd.className = 'grp';
    const head = document.createElement('div'); head.className = 'grp-head';
    head.innerHTML = `<input type="checkbox" class="grp-cb"> <b>${esc(g.title)}</b> <span style="opacity:.6">(${g.items.length})</span>`;
    gd.appendChild(head);
    const cbs = [];
    g.items.forEach(it => {
      const i = idx++; exportItems.push(it.spec);
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = `<input type="checkbox" data-i="${i}" class="exp-cb">
        <label>${esc(it.label)}</label>${it.meta ? `<span class="meta">${esc(it.meta)}</span>` : ''}`;
      const cb = row.querySelector('.exp-cb');
      cb.onchange = updateExportCount;
      row.querySelector('label').onclick = () => { cb.checked = !cb.checked; updateExportCount(); };
      cbs.push(cb); gd.appendChild(row);
    });
    head.querySelector('.grp-cb').onchange = e => { cbs.forEach(c => c.checked = e.target.checked); updateExportCount(); };
    wrap.appendChild(gd);
  });
  $('export-all').checked = false;
  updateExportCount();
}

function checkedExportSpecs() {
  return [...document.querySelectorAll('#export-list .exp-cb')].filter(c => c.checked).map(c => exportItems[+c.dataset.i]);

function updateExportCount() {
  const n = checkedExportSpecs().length;
  $('export-count').textContent = n ? t('export.count', { n }) : '';
}
$('export-all').onchange = e => {
  document.querySelectorAll('#export-list .exp-cb, #export-list .grp-cb').forEach(c => c.checked = e.target.checked);

  const rank = p => (p.region === 'cn' ? (zh ? 0 : 1) : p.region === 'intl' ? (zh ? 1 : 0) : 2);
  const groups = { subscription: [], api: [], local: [], custom: [] };
  Object.entries(presets).forEach(([k, p]) => { if (groups[p.group]) groups[p.group].push([k, p]); });
  groups.api.sort((a, b) => rank(a[1]) - rank(b[1]));
  return groups;
}
function guessPreset(p, presets) {
  if (p.preset && presets[p.preset]) return p.preset;
  const base = (p.base_url || '').replace(/\/+$/, '');
  if (p.type === 'claude-cli' && !base) return 'claude-cli';
  if (p.type === 'codex-cli') return 'codex-cli';
  const hit = Object.entries(presets).find(([k, pr]) => pr.group !== 'hidden' && pr.group !== 'custom' && pr.type === p.type
    && (pr.base_url || '').replace(/\/+$/, '') === base);
  if (hit) return hit[0];
  return p.type === 'anthropic' ? 'custom-anthropic' : p.type === 'claude-cli' ? 'claude-cli' : 'custom-openai';
}

function buildProfile(name, p, ai) {
  const el = profPanel(name);
  const presets = ai.presets || {};
  el.innerHTML = PROF_HTML.replace('{service}', esc(t('settings.service')));
  const q = c => el.querySelector(c);
  q('.p-title').textContent = t(name === 'primary' ? 'settings.profile_primary' : 'settings.profile_fast');
  q('.p-keylabel').textContent = t('settings.api_key');
  q('.p-modellabel').textContent = t('settings.model');
  q('.p-fetch').textContent = t('settings.fetch_models');
  q('.p-reasonlabel').textContent = t('settings.reasoning');
  q('.p-reason').options[0].textContent = t('settings.reasoning_default');
  q('.p-advlabel').textContent = t('settings.advanced');
  q('.p-typelabel').textContent = t('settings.type');
  ['claude-cli', 'codex-cli', 'anthropic', 'openai'].forEach((v, i) => { q('.p-type').options[i].textContent = t('settings.type_' + v.replace('-', '_')); });
  q('.p-baselabel').textContent = t('settings.base_url');
  q('.p-base').placeholder = t('settings.base_url_placeholder');
  q('.p-envlabel').textContent = t('settings.api_key_env');
  q('.p-ctxlabel').textContent = t('settings.max_context');
  q('.p-maxlabel').textContent = t('settings.max_tokens');
  q('.p-test').textContent = t('settings.test');

  const sel = q('.p-preset');
  const groups = presetGroups(presets);
  Object.entries(groups).forEach(([g, items]) => {
    if (!items.length) return;
    const og = document.createElement('optgroup'); og.label = t('settings.group_' + g);
    items.forEach(([k, pr]) => { const o = document.createElement('option'); o.value = k;
      o.textContent = g === 'subscription' ? t('settings.preset_' + k.replace(/-/g, '_')) : pr.label; og.appendChild(o); });
    sel.appendChild(og);
  });

  // stored values
  q('.p-type').value = p.type || 'claude-cli';
  q('.p-model').value = p.model || '';
  q('.p-base').value = p.base_url || '';
  q('.p-keyenv').value = p.api_key_env || '';
  q('.p-ctx').value = p.max_context_chars || '';
  q('.p-max').value = p.max_tokens && p.max_tokens !== 16000 ? p.max_tokens : '';
  q('.p-reason').value = p.reasoning || '';
  const key = q('.p-key');
  key.value = ''; key.dataset.dirty = '';
  key.placeholder = p.api_key_set ? t('settings.api_key_stored') : t('settings.api_key_placeholder');
  key.oninput = () => { key.dataset.dirty = '1'; };
  key.onchange = () => { if (key.value.trim()) fetchModels(name, true); };
  sel.value = guessPreset(p, presets);
  el.dataset.preset = sel.value;

  sel.onchange = () => {
    const pr = presets[sel.value]; if (!pr) return;
    el.dataset.preset = sel.value;
    q('.p-type').value = pr.type; q('.p-base').value = pr.base_url || '';
    q('.p-model').value = (name === 'fast' && pr.fast_model) ? pr.fast_model : (pr.model || '');
    q('.p-keyenv').value = pr.api_key_env || ''; q('.p-ctx').value = pr.max_context_chars || '';
    q('.p-reason').value = '';
    q('.p-modelpick').style.display = 'none';
    q('.test-out').textContent = '';
    refreshProfileUI(name, ai);
    if (pr.group === 'custom') q('.p-adv').open = true;
    if (pr.group === 'subscription' || pr.group === 'local') fetchModels(name, true);
  };
  q('.p-type').onchange = () => refreshProfileUI(name, ai);
  q('.p-fetch').onclick = () => fetchModels(name, false);
  q('.p-modelpick').onchange = e => { if (e.target.value !== '__') q('.p-model').value = e.target.value; };
  q('.p-test').onclick = () => testProfile(name);
  refreshProfileUI(name, ai);
}

function refreshProfileUI(name, ai) {
  const el = profPanel(name), q = c => el.querySelector(c);
  const presets = ai.presets || {};
  const pr = presets[el.dataset.preset] || {};
  const type = q('.p-type').value;
  const cli = CLI_TYPES.includes(type) && !q('.p-base').value.trim();
  const local = pr.group === 'local';
  q('.p-keywrap').style.display = (cli || local) ? 'none' : '';
  q('.p-reasonwrap').style.display = type === 'codex-cli' ? '' : 'none';
  q('.p-model').placeholder = cli ? t('settings.model_placeholder') : (local ? t('settings.model_local_placeholder') : t('settings.model_api_placeholder'));
  const link = q('.p-keylink');
  if (pr.key_url && !cli) { link.href = pr.key_url; link.textContent = t(local ? 'settings.download_link' : 'settings.key_link'); link.style.display = ''; }
  else link.style.display = 'none';
  // status line: is the CLI installed / logged in?
  const st = q('.p-status'), clis = ai.clis || {};
  st.style.display = 'none'; st.className = 'note p-status';
  if (type === 'claude-cli' && cli) {
    st.style.display = '';
    if (clis.claude) { st.classList.add('ok'); st.textContent = t('settings.claude_ok'); }
    else { st.innerHTML = esc(t('settings.claude_missing')) + ` <button type="button">${esc(t('settings.show_steps'))}</button>`;
      st.querySelector('button').onclick = () => openCliGuide('claude'); }
  } else if (type === 'codex-cli') {
    st.style.display = '';
    if (clis.codex && clis.codex_login === 'chatgpt') { st.classList.add('ok'); st.textContent = t('settings.codex_ok'); }
    else if (clis.codex && clis.codex_login === 'apikey') { st.classList.add('ok'); st.textContent = t('settings.codex_apikey'); }
    else { st.innerHTML = esc(t(clis.codex ? 'settings.codex_login' : 'settings.codex_missing')) + ` <button type="button">${esc(t('settings.show_steps'))}</button>`;
      st.querySelector('button').onclick = () => openCliGuide('codex'); }
  } else if (local) {
    st.style.display = ''; st.textContent = t('settings.local_hint');
  }
}

async function fetchModels(name, quiet) {
  const el = profPanel(name), q = c => el.querySelector(c);
  const b = q('.p-fetch'), pick = q('.p-modelpick');
  b.disabled = true; const label = b.textContent; b.textContent = '…';
  try {
    const r = await api('/api/settings/ai/models', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: name, inline: readProfile(name) }) });
    const models = r.models || [];
    if (!models.length) { if (!quiet) toast(t('settings.models_none')); pick.style.display = 'none'; return; }
    pick.innerHTML = `<option value="__">${esc(t('settings.models_pick', { n: models.length }))}</option>`
      + models.map(m => `<option value="${esc(m.id)}" title="${esc(m.desc || '')}">${esc(m.name === m.id || !m.id ? (m.id || m.name) : m.name + ' · ' + m.id)}</option>`).join('');
    pick.style.display = '';
    const cur = q('.p-model').value;
    pick.value = models.some(m => m.id === cur) ? cur : '__';
    if (!cur && !CLI_TYPES.includes(q('.p-type').value) && models[0]) {
      // local servers: pre-select the first installed model so "Test" works right away
      const pr = ((state.cfg.ai || {}).presets || {})[el.dataset.preset] || {};
      if (pr.group === 'local') { q('.p-model').value = models[0].id; pick.value = models[0].id; }
    }
  } catch (e) { if (!quiet) toast(t('settings.models_failed', { msg: e.message }), 8000); pick.style.display = 'none'; }
  finally { b.disabled = false; b.textContent = label; }
}

async function testProfile(name) {
  const el = profPanel(name), out = el.querySelector('.test-out'), b = el.querySelector('.p-test');
  b.disabled = true; out.className = 'test-out'; out.textContent = t('settings.testing');
  try {
    const r = await api('/api/settings/ai/test', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: name, inline: readProfile(name) }) });
    out.className = 'test-out ' + (r.ok ? 'ok' : 'bad');
    out.textContent = r.ok ? t('settings.test_ok', { model: r.model, ms: r.latency_ms, reply: r.reply }) : t('settings.test_failed', { msg: r.error });
    return r.ok;
  } catch (e) { out.className = 'test-out bad'; out.textContent = t('settings.test_failed', { msg: e.message }); return false; }
  finally { b.disabled = false; }
}

/* ---------- quit (there is no terminal window to close) ---------- */
async function quitCoco() {
  const go = async force => api('/api/shutdown', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ force }) });
  try {
    let r = await go(false);
    if (!r.ok && r.busy) {
      const what = r.busy.map(b => t('quit.busy_' + b)).join(t('quit.and'));
      const ans = await choose(t('quit.confirm_title'), t('quit.confirm_body', { what }),
        [['cancel', t('common.cancel')], ['quit', t('quit.anyway'), true]]);
      if (ans !== 'quit') return;
      if (rec.active) await stopBrowserRecording(true);
      r = await go(true);
    } else if (!r.ok) return;
    state.quitting = true;
    closeSettings();
    $('quit-screen').classList.add('show');
  } catch (e) { toast(t('common.failed', { msg: e.message }), 8000); }
}
$('btn-quit').onclick = quitCoco;
$('btn-quit2').onclick = quitCoco;

/* generic choice dialog → resolves with the key of the button pressed (null on Esc / backdrop) */
function choose(title, body, buttons) {
  return new Promise(resolve => {
    $('choose-title').textContent = title;
    $('choose-body').textContent = body;
    const row = $('choose-buttons'); row.innerHTML = '';
    const done = v => { $('choose-overlay').classList.remove('show'); choose._close = null; resolve(v); };
    buttons.forEach(([key, label, primary]) => {
      const b = document.createElement('button'); b.textContent = label; if (primary) b.className = 'primary';
      b.onclick = () => done(key); row.appendChild(b);
    });
    choose._close = () => done(null);
    $('choose-overlay').onclick = e => { if (e.target === $('choose-overlay')) done(null); };
    $('choose-overlay').classList.add('show');
  });
}

    ['claude', t('welcome.claude_title'), t('welcome.claude_desc'), badge(!!clis.claude, clis.claude ? t('welcome.ready') : t('welcome.not_installed'))],
    ['api', t('welcome.api_title'), t('welcome.api_desc'), ''],
    ['local', t('welcome.local_title'), t('welcome.local_desc'), ''],
  ];
  $('welcome-choices').innerHTML = cards.map(([k, title, desc, b]) =>
    `<button class="choice" data-k="${k}"><b>${esc(title)}</b><small>${esc(desc)}</small>${b}</button>`).join('');
  $('welcome-choices').querySelectorAll('.choice').forEach(c => c.onclick = () => pickWelcome(c.dataset.k));
  $('welcome-overlay').classList.add('show');
}
async function useSubscription(which) {
  // the CLI is ready: save it as the main channel and prove it with one tiny request
  const preset = which === 'codex' ? 'codex-cli' : 'claude-cli';
  const pr = ((state.cfg.ai || {}).presets || {})[preset] || {};
  toast(t('welcome.testing'), 20000);
  try {
    await api('/api/settings/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ primary: { type: pr.type, model: '', base_url: '', api_key: null, api_key_env: '',
        max_context_chars: 0, max_tokens: 16000, extra_args: [], reasoning: '', preset } }) });
    const r = await api('/api/settings/ai/test', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: 'primary' }) });
    applyAIState(await api('/api/config'));
    if (r.ok) toast(t('welcome.done', { name: which === 'codex' ? 'ChatGPT' : 'Claude', ms: r.latency_ms }), 6000);
    else toast(t('settings.test_failed', { msg: r.error }), 10000);
  } catch (e) { toast(t('common.failed', { msg: e.message }), 8000); }
}
async function pickWelcome(k) {
  const clis = ((state.cfg || {}).ai || {}).clis || {};
  if (k === 'codex' || k === 'claude') {
    const ready = k === 'codex' ? (clis.codex && clis.codex_login) : clis.claude;
    closeWelcome();
    if (ready) await useSubscription(k); else openCliGuide(k, true);
    return;
  }
  closeWelcome();
  await openSettings('ai');
  const sel = profPanel('primary').querySelector('.p-preset');
  if (k === 'local') sel.value = 'ollama';
  else { const first = presetGroups((state.cfg.ai || {}).presets || {}).api[0]; if (first) sel.value = first[0]; }
  sel.onchange();
  const key = profPanel('primary').querySelector('.p-key');
  if (k === 'api' && key) key.focus();
}

let cliGuideFor = 'claude', cliGuideSave = false;
function openCliGuide(which, saveWhenReady) {
  cliGuideFor = which; cliGuideSave = !!saveWhenReady;
  const plat = { windows: 'win', linux: 'linux' }[state.caps.platform] || 'mac';
  const clis = ((state.cfg || {}).ai || {}).clis || {};
  const loginOnly = which === 'codex' && clis.codex && !clis.codex_login;
  $('cli-title').textContent = t(`cliguide.${which}_title`);
  $('cli-intro').textContent = t(`cliguide.${which}_intro`);
  $('cli-steps').textContent = loginOnly ? t('cliguide.codex_login_steps') : t(`cliguide.${which}_steps_${plat}`);
  $('cli-overlay').classList.add('show');
}
function closeCliGuide() { $('cli-overlay').classList.remove('show'); }
$('cli-overlay').onclick = e => { if (e.target === $('cli-overlay')) closeCliGuide(); };
$('btn-cli-recheck').onclick = async () => {
  try {
    const cfg = await api('/api/config');
    state.cfg = cfg;
    const clis = (cfg.ai || {}).clis || {};
    const ok = cliGuideFor === 'codex' ? (clis.codex && clis.codex_login) : clis.claude;
    if (!ok) { toast(t(`cliguide.${cliGuideFor}_recheck_fail`), 9000); return; }
    closeCliGuide();
    if (cliGuideSave || !aiReady(cfg)) await useSubscription(cliGuideFor);
    else { toast(t('cliguide.recheck_ok')); applyAIState(cfg); if ($('settings-overlay').classList.contains('show')) openSettings('ai'); }
  } catch { toast(t(`cliguide.${cliGuideFor}_recheck_fail`), 9000); }
};

/* ---------- empty state ---------- */
$('start-rec').onclick = () => $('btn-record').click();
$('start-upload').onclick = () => $('file-input').click();
$('start-paste').onclick = () => { setImpTab('paste'); $('import-overlay').classList.add('show'); $('imp-text').focus(); };

/* ---------- boot ---------- */
async function bootstrap() {
  const cfg = await (await fetch('/api/config')).json();
  await loadI18n(pickLang(cfg));
  state.templates = await api('/api/templates');
  applyCaps(cfg);
  applyAIState(cfg);
  await loadMeetings();
  updateChatRef();
  await checkRecordingOnLoad();
  setRecUI();
  if (!aiReady(cfg) && !(cfg.ai || {}).configured && !sessionStorage.getItem('coco-welcome-later')) openWelcome();
}

(async function init() {
  $('brand-icon').src = document.querySelector('link[rel="icon"]').href;
  while (true) {
    try { await bootstrap(); setConn(false); break; }
    catch (e) { console.error(e); setConn(true); await new Promise(r => setTimeout(r, 2000)); }
  }
  setInterval(async () => {
    if (state.quitting) return;
    try { await loadMeetings(); setConn(false); }
    catch { setConn(true); }
  }, 8000);
})();
</script>
