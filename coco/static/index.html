<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>coco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2326806a'/%3E%3Cstop offset='1' stop-color='%23185849'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1024' height='1024' rx='229' fill='url(%23g)'/%3E%3Cpath d='M 681.96 323.25 A 254 254 0 1 0 681.96 700.75' fill='none' stroke='%23fff' stroke-width='92' stroke-linecap='round'/%3E%3Cg fill='%23fff'%3E%3Crect x='381' y='437' width='50' height='150' rx='25'/%3E%3Crect x='461' y='382' width='50' height='260' rx='25'/%3E%3Crect x='541' y='437' width='50' height='150' rx='25'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="conn-banner" class="banner bad"></div>
<div id="ai-banner" class="banner"></div>

<div id="app">
  <!-- column 1: navigation -->
  <nav id="nav">
    <div class="brand"><img id="brand-icon" alt=""><span>coco</span></div>
    <button class="nav-item" data-view="library" data-i18n="nav.library"></button>
    <button class="nav-item" data-view="memory" data-i18n="nav.memory"></button>
    <button class="nav-item" data-view="prep" data-i18n="nav.prep"></button>
    <button class="nav-item" data-view="insight" data-i18n="nav.insight"></button>
    <button class="nav-item" data-view="briefs" data-i18n="nav.briefs"></button>
    <div id="rec-indicator" class="rec-indicator" hidden>
      <span class="rec-dot"></span><span id="rec-indicator-time"></span>
      <button id="rec-indicator-stop" class="link bad" data-i18n="nav.stop"></button>
    </div>
    <div class="nav-fill"></div>
    <div class="nav-status">
      <button id="ai-chip" class="status-line"></button>
      <button id="asr-chip" class="status-line"></button>
    </div>
    <button class="nav-item" data-view="settings" data-i18n="nav.settings"></button>
    <button class="nav-item" id="nav-export" data-i18n="nav.export"></button>
    <button class="nav-item quiet" id="btn-quit" data-i18n="nav.quit"></button>
  </nav>

  <!-- column 2: lists, one per view -->
  <section id="list">
    <div class="list-view" data-list="library">
      <div class="list-head">
        <div class="row-actions">
          <button id="btn-record" class="primary" data-i18n="library.record" data-i18n-title="header.record_title"></button>
          <button id="btn-upload" data-i18n="library.upload" data-i18n-title="header.upload_title"></button>
          <button id="btn-import" data-i18n="library.import" data-i18n-title="header.import_title"></button>
        </div>
        <input id="search-box" type="search" autocomplete="off" data-i18n-placeholder="library.search_placeholder">
        <div id="filter-bar">
          <input type="date" id="filter-from" data-i18n-title="sidebar.filter_from_title">
          <span class="muted">–</span>
          <input type="date" id="filter-to" data-i18n-title="sidebar.filter_to_title">
          <button class="link" id="filter-clear" data-i18n="sidebar.filter_clear"></button>
        </div>
      </div>
      <div id="mtg-list" class="list-body"></div>
      <div id="sel-bar" class="list-foot" hidden>
        <span id="sel-count" class="muted"></span>
        <button id="sel-insight" data-i18n="library.sel_insight"></button>
        <button id="sel-download" data-i18n="library.sel_download"></button>
        <button id="sel-clear" class="link" data-i18n="common.cancel"></button>
      </div>
    </div>

    <div class="list-view" data-list="memory" hidden>
      <div class="list-head">
        <input id="mem-search" type="search" autocomplete="off" data-i18n-placeholder="mem.search_placeholder">
        <div class="seg" id="mem-types"></div>
        <div class="seg" id="mem-status" hidden></div>
      </div>
      <div id="mem-list" class="list-body"></div>
      <div class="list-foot">
        <button id="mem-overview" class="link" data-i18n="mem.overview"></button>
        <button id="mem-new" class="link" data-i18n="mem.new"></button>
      </div>
    </div>

    <div class="list-view" data-list="prep" hidden>
      <div class="list-head"><div class="row-actions"><button id="prep-new" class="primary" data-i18n="prep.new"></button></div></div>
      <div id="prep-list" class="list-body"></div>
    </div>

    <div class="list-view" data-list="insight" hidden>
      <div class="list-head"><div class="row-actions"><button id="insight-new" class="primary" data-i18n="insight.new"></button></div></div>
      <div id="insight-list" class="list-body"></div>
    </div>

    <div class="list-view" data-list="briefs" hidden>
      <div class="list-head"><div class="seg" id="brief-mode"></div></div>
      <div id="brief-list" class="list-body"></div>
    </div>

    <div class="list-view" data-list="settings" hidden>
      <div class="list-body" id="set-sections"></div>
    </div>
  </section>

  <!-- column 3: content -->
  <main id="content">
    <div class="view" data-view="library">
      <div id="empty" class="empty">
        <h1 data-i18n="empty.title"></h1>
        <p class="muted" data-i18n="empty.sub"></p>
        <div class="starts">
          <button class="start" id="start-rec"><b data-i18n="empty.rec_title"></b><span data-i18n="empty.rec_desc"></span></button>
          <button class="start" id="start-upload"><b data-i18n="empty.upload_title"></b><span data-i18n="empty.upload_desc"></span></button>
          <button class="start" id="start-paste"><b data-i18n="empty.paste_title"></b><span data-i18n="empty.paste_desc"></span></button>
        </div>
        <p class="muted small" data-i18n="empty.foot"></p>
      </div>
      <div id="meeting" hidden>
        <header class="doc-head">
          <div class="title-row">
            <h1 id="mtg-title"></h1>
            <div class="head-actions">
              <button id="btn-ask-toggle" class="link" data-i18n="doc.ask"></button>
            </div>
          </div>
          <div class="meta" id="mtg-meta"></div>
          <div class="meta" id="mtg-digest"></div>
          <div id="participants-row" class="meta"></div>
        </header>
        <div id="tabs" class="tabs"></div>
        <div id="report-actions" class="toolbar"></div>
        <div id="doc" class="doc"><div class="md" id="doc-md"></div></div>
      </div>
    </div>

    <div class="view" data-view="memory" hidden><div id="mem-content" class="doc"></div></div>
    <div class="view" data-view="prep" hidden><div id="prep-content" class="doc"></div></div>
    <div class="view" data-view="insight" hidden><div id="insight-content" class="doc"></div></div>
    <div class="view" data-view="briefs" hidden><div id="brief-content" class="doc"></div></div>
    <div class="view" data-view="settings" hidden><div id="settings-content" class="doc settings"></div></div>
    <div class="view" data-view="live" hidden><div id="live-content" class="doc"></div></div>
  </main>

  <!-- column 4: questions (meeting / whole library) -->
  <aside id="chat" hidden>
    <div class="chat-head">
      <b data-i18n="chat.title"></b>
      <span class="fill"></span>
      <button id="btn-chat-export" class="link" data-i18n="chat.export" data-i18n-title="chat.export_title"></button>
      <button id="btn-chat-close" class="link" data-i18n="common.close"></button>
    </div>
    <div id="chat-log"><div class="bubble coco" data-i18n="chat.welcome"></div></div>
    <div id="chat-ref" class="muted small"></div>
    <label id="chat-opts" class="small"><input type="checkbox" id="chat-all"> <span data-i18n="chat.all"></span></label>
    <div id="chat-input-row">
      <textarea id="chat-input" rows="2"></textarea>
      <button id="btn-send" class="primary" data-i18n="chat.send"></button>
    </div>
  </aside>
</div>

<input type="file" id="file-input" multiple hidden>

<!-- dialogs -->
<div id="memory-dialog" class="ovl"><div class="dialog wide">
  <h2 data-i18n="memory.title"></h2>
  <div class="seg" id="mem-tabs">
    <button data-tab="content" data-i18n="memory.tab_manual"></button>
    <button data-tab="longterm" data-i18n="memory.tab_long"></button>
    <button data-tab="glossary" data-i18n="memory.tab_glossary"></button>
  </div>
  <p id="mem-hint" class="muted small"></p>
  <textarea id="memory-text" class="mono tall"></textarea>
  <div class="row">
    <button id="btn-dl-memory" data-i18n="common.download_md"></button>
    <button id="btn-clear-memory" data-i18n="memory.clear"></button>
    <span class="fill"></span>
    <button data-close="memory-dialog" data-i18n="common.cancel"></button>
    <button class="primary" id="btn-save-memory" data-i18n="common.save"></button>
  </div>
</div></div>

<div id="export-dialog" class="ovl"><div class="dialog">
  <h2 data-i18n="export.title"></h2>
  <p class="muted small" data-i18n="export.hint"></p>
  <div id="export-list" class="pick-list"></div>
  <div class="row">
    <label class="small"><input type="checkbox" id="export-all"> <span data-i18n="export.all"></span></label>
    <span id="export-count" class="muted small"></span>
    <span class="fill"></span>
    <button data-close="export-dialog" data-i18n="common.cancel"></button>
    <button class="primary" id="btn-export-go" data-i18n="export.go"></button>
  </div>
</div></div>

<div id="import-dialog" class="ovl"><div class="dialog">
  <h2 data-i18n="import.title"></h2>
  <div class="seg" id="imp-tabs">
    <button data-tab="path" data-i18n="import.tab_path"></button>
    <button data-tab="paste" data-i18n="import.tab_paste"></button>
  </div>
  <div id="imp-path-pane">
    <p class="muted small"><span data-i18n="import.path_hint"></span> <span id="imp-path-tip"></span></p>
    <input type="text" id="imp-path" class="full">
  </div>
  <div id="imp-paste-pane" hidden>
    <p class="muted small" data-i18n="import.paste_hint"></p>
    <textarea id="imp-text" class="full" data-i18n-placeholder="import.paste_placeholder"></textarea>
    <label class="fld" data-i18n="import.title_label"></label>
    <input type="text" id="imp-title" class="full" data-i18n-placeholder="import.title_placeholder">
    <label class="fld" data-i18n="import.date_label"></label>
    <input type="date" id="imp-date">
  </div>
  <div class="row">
    <span class="fill"></span>
    <button data-close="import-dialog" data-i18n="common.cancel"></button>
    <button class="primary" id="btn-import-go" data-i18n="import.go"></button>
  </div>
</div></div>

<div id="audiohelp-dialog" class="ovl"><div class="dialog">
  <h2 data-i18n="audiohelp.title"></h2>
  <p id="audiohelp-body" class="small"></p>
  <p id="audiohelp-files" class="muted small"></p>
  <div class="opt"><b data-i18n="audiohelp.opt0_title"></b><span data-i18n="audiohelp.opt0_body"></span>
    <div><button id="btn-audiohelp-settings" class="link" data-i18n="audiohelp.open_settings"></button></div></div>
  <div class="opt"><b data-i18n="audiohelp.opt1_title"></b><span data-i18n="audiohelp.opt1_body"></span></div>
  <div class="opt"><b data-i18n="audiohelp.opt2_title"></b><span data-i18n="audiohelp.opt2_body"></span>
    <div><button id="btn-audiohelp-paste" class="link" data-i18n="audiohelp.paste"></button></div></div>
  <div class="row"><span class="fill"></span><button class="primary" data-close="audiohelp-dialog" data-i18n="audiohelp.close"></button></div>
</div></div>

<div id="cli-dialog" class="ovl"><div class="dialog">
  <h2 id="cli-title"></h2>
  <p class="muted small" id="cli-intro"></p>
  <pre id="cli-steps" class="steps"></pre>
  <p class="muted small" data-i18n="cliguide.alt"></p>
  <div class="row">
    <span class="fill"></span>
    <button data-close="cli-dialog" data-i18n="common.cancel"></button>
    <button class="primary" id="btn-cli-recheck" data-i18n="cliguide.recheck"></button>
  </div>
</div></div>

<div id="welcome-dialog" class="ovl"><div class="dialog wide">
  <h2 data-i18n="welcome.title"></h2>
  <p class="muted small" data-i18n="welcome.intro"></p>
  <div class="choices" id="welcome-choices"></div>
  <p class="muted small" data-i18n="welcome.privacy"></p>
  <div class="row"><span class="fill"></span><button id="btn-welcome-later" data-i18n="welcome.later"></button></div>
</div></div>

<div id="choose-dialog" class="ovl"><div class="dialog">
  <h2 id="choose-title"></h2>
  <p id="choose-body" class="pre"></p>
  <div class="row" id="choose-buttons"></div>
</div></div>

<div id="prompt-dialog" class="ovl"><div class="dialog">
  <h2 id="prompt-title"></h2>
  <p id="prompt-body" class="muted small"></p>
  <input type="text" id="prompt-input" class="full" list="prompt-options">
  <datalist id="prompt-options"></datalist>
  <div class="row"><span class="fill"></span>
    <button id="prompt-cancel" data-i18n="common.cancel"></button>
    <button id="prompt-ok" class="primary" data-i18n="common.ok"></button></div>
</div></div>

<div id="quit-screen"><div><b data-i18n="quit.title"></b><p class="muted" data-i18n="quit.body"></p></div></div>
<div id="toast" role="status"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
